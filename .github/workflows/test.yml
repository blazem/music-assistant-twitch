name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Twitch provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: twitch-provider

      - name: Check out Music Assistant 2.10.8
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: music-assistant/server
          ref: 2.10.8
          path: music-assistant-server

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Overlay provider and tests
        run: |
          cp -a twitch-provider/music_assistant/providers/twitch music-assistant-server/music_assistant/providers/
          cp -a twitch-provider/tests/providers/twitch music-assistant-server/tests/providers/

      - name: Set up Music Assistant development environment
        working-directory: music-assistant-server
        run: scripts/setup.sh

      - name: Install Twitch provider requirement
        working-directory: music-assistant-server
        run: uv pip install --python .venv/bin/python streamlink==8.6.2

      - name: Run focused tests
        working-directory: music-assistant-server
        run: .venv/bin/pytest tests/providers/twitch

      - name: Run provider lint and type checks
        working-directory: music-assistant-server
        run: |
          .venv/bin/ruff check music_assistant/providers/twitch tests/providers/twitch
          .venv/bin/ruff format --check music_assistant/providers/twitch tests/providers/twitch
          .venv/bin/mypy music_assistant/providers/twitch
